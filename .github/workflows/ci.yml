name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-upload-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run test
        working-directory: ./upload-service
        run: mvn test

      - name: Build jar
        working-directory: ./upload-service
        run: mvn clean package -DskipTests

  test-matching-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: ./matching-service
        run: mvn test

      - name: Build jar
        working-directory: ./matching-service
        run: mvn clean package -DskipTests

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [test-upload-service, test-matching-service]

    steps:
      - uses: actions/checkout@v4

      - name: Build upload-service image
        run: docker build -t upload-service:ci ./upload-service

      - name: Build matching-service image
        run: docker build -t matching-service:ci ./matching-service

