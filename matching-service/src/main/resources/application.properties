spring.application.name=matching-service
server.port=8082

gemini.api.key=${GEMINI_API_KEY}


gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}

upload.service.url=${UPLOAD_SERVICE_URL:http://upload-service:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:matchingservice}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health